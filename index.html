<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#10131c">
  <title>Thời gian hiện tại</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="clock-shell" aria-label="Đồng hồ hiện tại">
    <div class="topbar">
      <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Thời gian hiện tại</div>
      <div class="controls">
        <div class="pet-switch" role="group" aria-label="Chọn con vật">
          <button class="pet-button active" type="button" data-pet="bear">🐻 Gấu</button>
          <button class="pet-button" type="button" data-pet="cat">🐱 Mèo</button>
          <button class="pet-button" type="button" data-pet="rabbit">🐰 Thỏ</button>
          <button class="pet-button" type="button" data-pet="monkey">🐵 Khỉ</button>
        </div>
        <div class="mode-switch" role="group" aria-label="Chọn định dạng giờ">
          <button class="mode-button active" data-mode="24" type="button">24 GIỜ</button>
          <button class="mode-button" data-mode="12" type="button">12 GIỜ</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Chuyển sang chế độ sáng" title="Chuyển chế độ sáng/tối">☼</button>
      </div>
    </div>

    <section class="clock-area">
      <div class="pet-stage" aria-label="Con vật đang nhìn theo con trỏ chuột">
        <div class="pet-entity active" id="pet-bear" aria-label="Chú gấu đang nhìn theo con trỏ chuột">
          <span class="bear-ear left"></span>
          <span class="bear-ear right"></span>
          <div class="bear-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="bear-muzzle"><span class="bear-nose"></span><span class="bear-mouth"></span></div>
          </div>
        </div>

        <div class="pet-entity" id="pet-cat" aria-label="Chú mèo đang nhìn theo con trỏ chuột">
          <span class="cat-ear left"></span>
          <span class="cat-ear right"></span>
          <div class="cat-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <span class="cat-nose"></span>
            <span class="cat-mouth"></span>
            <span class="cat-whiskers left"></span>
            <span class="cat-whiskers right"></span>
          </div>
        </div>

        <div class="pet-entity" id="pet-rabbit" aria-label="Chú thỏ đang nhìn theo con trỏ chuột">
          <span class="rabbit-ear left"></span>
          <span class="rabbit-ear right"></span>
          <div class="rabbit-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="rabbit-muzzle">
              <span class="rabbit-nose"></span>
              <span class="rabbit-mouth"></span>
              <div class="rabbit-teeth"><span class="rabbit-tooth"></span><span class="rabbit-tooth"></span></div>
            </div>
          </div>
        </div>

        <div class="pet-entity" id="pet-monkey" aria-label="Chú khỉ đang nhìn theo con trỏ chuột">
          <span class="monkey-ear left"></span>
          <span class="monkey-ear right"></span>
          <div class="monkey-head">
            <div class="monkey-face-mask"></div>
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="monkey-muzzle">
              <span class="monkey-nostril left"></span>
              <span class="monkey-nostril right"></span>
              <span class="monkey-mouth"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="time" aria-live="polite" aria-label="Giờ hiện tại">
        <div class="digit"><span id="hour-tens">0</span></div>
        <div class="digit"><span id="hour-ones">0</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="digit"><span id="minute-tens">0</span></div>
        <div class="digit"><span id="minute-ones">0</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="digit"><span id="second-tens">0</span></div>
        <div class="digit"><span id="second-ones">0</span></div>
        <span class="period" id="period" aria-hidden="true"></span>
      </div>
    </section>

    <div class="date-row">
      <div class="date"><strong id="weekday">Thứ Hai</strong><span id="calendar-date">, 01 tháng 01 năm 2026</span></div>
      <div class="timezone" id="timezone">LOCAL TIME</div>
    </div>

    <section class="music-panel" aria-label="Trình phát nhạc">
      <div class="music-heading">
        <h2 class="music-title">Music console</h2>
        <span class="music-hint">SoundCloud Embed · phát trực tiếp trong trang</span>
      </div>
      <form class="track-form search-form" id="search-form">
        <input class="track-input" id="search-input" type="url" placeholder="Dán link bài hát hoặc playlist SoundCloud..." autocomplete="off" required>
        <button class="add-track" type="submit">+ Thêm SoundCloud</button>
      </form>
      <div class="search-results" id="search-results" aria-live="polite"></div>
      <div class="player-bar">
        <div>
          <div class="current-track" id="current-track">Chưa có bài hát</div>
          <div class="player-status" id="player-status">Thêm link audio để phát playlist tự động</div>
        </div>
        <div class="player-actions">
          <button class="player-button" id="repeat-track" type="button" aria-label="Lặp bài đang chọn" title="Lặp bài đang chọn">↻</button>
          <button class="player-button" id="previous-track" type="button" aria-label="Bài trước" title="Bài trước">‹</button>
          <button class="player-button" id="toggle-play" type="button" aria-label="Phát nhạc" title="Phát nhạc">▶</button>
          <button class="player-button" id="next-track" type="button" aria-label="Bài tiếp theo" title="Bài tiếp theo">›</button>
          <label class="volume-control" for="volume-slider" title="Âm lượng">🔊<input class="volume-slider" id="volume-slider" type="range" min="0" max="100" value="80" aria-label="Âm lượng"></label>
        </div>
      </div>
      <div class="playlist" id="playlist" aria-live="polite"></div>
      <audio id="audio-player" preload="metadata"></audio>
      <iframe class="soundcloud-player" id="soundcloud-player" title="SoundCloud player" allow="autoplay" scrolling="no"></iframe>
    </section>
  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="script.js"></script>
</body>
</html>
