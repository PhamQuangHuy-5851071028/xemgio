<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#10131c">
  <title>Thời gian hiện tại</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --surface: rgba(24, 28, 40, 0.62);
      --surface-strong: rgba(28, 33, 47, 0.84);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f5f7fb;
      --muted: #9aa2b5;
      --accent: #f8d0a8;
      --accent-strong: #ea8d54;
      --warm: #f4b07a;
      --button-light: #fff7f1;
      --button-mid: #f8d0a8;
      --button-deep: #ea8d54;
      --button-text: #2d1d12;
      --button-shadow: rgba(234, 141, 84, 0.35);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #edf2f0;
      --surface: rgba(255, 255, 255, 0.64);
      --surface-strong: rgba(255, 255, 255, 0.86);
      --line: rgba(30, 55, 55, 0.14);
      --text: #1c292a;
      --muted: #657577;
      --warm: #b56e31;
      --shadow: 0 28px 80px rgba(48, 77, 73, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 12px 0;
      color: var(--text);
      font-family: 'Manrope', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(111, 198, 174, 0.13), transparent 28%),
        radial-gradient(circle at 88% 80%, rgba(240, 188, 132, 0.1), transparent 30%),
        linear-gradient(135deg, #090b11 0%, #111622 52%, #0b1015 100%);
      transition: background 300ms ease, color 300ms ease;
    }

    [data-theme="light"] body {
      background:
        radial-gradient(circle at 15% 20%, rgba(111, 198, 174, 0.2), transparent 28%),
        radial-gradient(circle at 88% 80%, rgba(240, 188, 132, 0.2), transparent 30%),
        linear-gradient(135deg, #e8f1ee 0%, #f7f8f4 52%, #e9efec 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    .clock-shell {
      width: min(920px, calc(100% - 32px));
      padding: clamp(20px, 3.8vw, 42px);
      position: relative;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(36, 42, 58, 0.7), rgba(15, 18, 28, 0.7));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: rise-in 700ms cubic-bezier(.2,.8,.2,1) both;
      transition: background 300ms ease, border-color 300ms ease, box-shadow 300ms ease;
      z-index: 1;
    }

    [data-theme="light"] .clock-shell {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.76), rgba(237, 245, 241, 0.68));
    }

    .clock-shell::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 14%;
      width: 32%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
    }

    .topbar, .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pet-switch {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
    }

    .pet-button {
      border: 0;
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--muted);
      background: transparent;
      font: 700 0.64rem 'Manrope', sans-serif;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
      white-space: nowrap;
    }

    .pet-button:hover,
    .pet-button.active {
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 55%, var(--button-deep) 100%);
      box-shadow: 0 4px 12px var(--button-shadow);
    }

    .pet-button:active { transform: scale(0.94); }

    .pet-stage {
      width: 140px;
      height: 110px;
      position: relative;
      margin: 0 auto clamp(22px, 3vw, 34px);
    }

    .pet-entity {
      width: 126px;
      height: 88px;
      position: absolute;
      top: 10px;
      left: 7px;
      display: none;
      transform-origin: center bottom;
      animation: pet-float 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.2));
    }

    .pet-entity.active { display: block; }

    .pet-eye {
      width: 22px;
      height: 20px;
      position: absolute;
      top: 22px;
      z-index: 2;
      border-radius: 50%;
      background: #fffaf0;
      box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.2);
    }

    .pet-eye.left { left: 19px; }
    .pet-eye.right { right: 19px; }

    .pet-pupil {
      width: 9px;
      height: 11px;
      position: absolute;
      top: 4px;
      left: 7px;
      border-radius: 50%;
      background: #182125;
      will-change: transform;
    }

    .pet-pupil::after {
      content: '';
      width: 3px;
      height: 3px;
      position: absolute;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .bear-ear, .cat-ear, .rabbit-ear, .monkey-ear {
      position: absolute;
    }

    .bear-ear {
      width: 42px;
      height: 42px;
      top: 0;
      border: 5px solid #57372d;
      border-radius: 50%;
      background: #a96542;
    }

    .bear-ear::after, .monkey-ear::after {
      content: '';
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #efa28d;
    }

    .bear-ear.left { left: 12px; }
    .bear-ear.right { right: 12px; }

    .bear-head, .cat-head, .rabbit-head, .monkey-head {
      width: 102px;
      height: 74px;
      position: absolute;
      left: 12px;
      top: 14px;
      z-index: 1;
    }

    .bear-head {
      border: 5px solid #57372d;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(145deg, #b36d43, #8f5035);
    }

    .bear-muzzle {
      width: 42px;
      height: 27px;
      position: absolute;
      left: 25px;
      bottom: 6px;
      border-radius: 50%;
      background: #e4a85c;
    }

    .bear-nose {
      width: 14px;
      height: 10px;
      position: absolute;
      top: 4px;
      left: 14px;
      border-radius: 50%;
      background: #593128;
    }

    .bear-mouth {
      width: 14px;
      height: 8px;
      position: absolute;
      top: 11px;
      left: 14px;
      border-bottom: 2px solid #392622;
      border-radius: 50%;
    }

    .cat-ear {
      width: 34px;
      height: 38px;
      top: 2px;
      border: 5px solid #554b52;
      background: #e9e7e9;
      clip-path: polygon(50% 0, 0 100%, 100% 100%);
    }

    .cat-ear::after {
      content: '';
      position: absolute;
      inset: 7px;
      background: #eca4b5;
      clip-path: polygon(50% 15%, 15% 100%, 85% 100%);
    }

    .cat-ear.left { left: 14px; transform: rotate(-16deg); }
    .cat-ear.right { right: 14px; transform: rotate(16deg); }

    .cat-head {
      border: 5px solid #554b52;
      border-radius: 50% 50% 46% 46%;
      background: linear-gradient(145deg, #f1f1f2, #d7d6db);
    }

    .cat-head .pet-eye {
      width: 25px;
      height: 25px;
      top: 20px;
      border: 4px solid #675b65;
      background: #fffdf4;
    }

    .cat-head .pet-pupil { width: 11px; height: 14px; left: 3px; top: 1px; }
    .cat-nose { width: 11px; height: 8px; position: absolute; left: 41px; bottom: 20px; border-radius: 40%; background: #b7657d; }
    .cat-mouth { width: 16px; height: 8px; position: absolute; left: 38px; bottom: 12px; border-bottom: 2px solid #554b52; border-radius: 50%; }
    .cat-whiskers { width: 22px; height: 12px; position: absolute; bottom: 14px; }
    .cat-whiskers.left { left: 6px; border-top: 2px solid #554b52; border-bottom: 2px solid #554b52; transform: rotate(5deg); }
    .cat-whiskers.right { right: 6px; border-top: 2px solid #554b52; border-bottom: 2px solid #554b52; transform: rotate(-5deg); }

    .rabbit-ear {
      width: 28px;
      height: 60px;
      top: -30px;
      border: 4.5px solid #675d68;
      border-radius: 50% 50% 40% 40%;
      background: #e4dce8;
    }

    .rabbit-ear::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #eca4b5;
    }

    .rabbit-ear.left { left: 24px; transform: rotate(-8deg); }
    .rabbit-ear.right { right: 24px; transform: rotate(8deg); }

    .rabbit-head {
      border: 5px solid #675d68;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(145deg, #e4dce8, #c6b7cc);
    }

    .rabbit-head .pet-eye {
      width: 24px;
      height: 24px;
      top: 21px;
      border: 4px solid #6c606b;
      background: #fffdfd;
    }

    .rabbit-head .pet-pupil { width: 10px; height: 12px; left: 3px; top: 2px; }
    .rabbit-muzzle { width: 38px; height: 24px; position: absolute; left: 27px; bottom: 6px; border-radius: 50%; background: #f1c9d2; }
    .rabbit-nose { width: 12px; height: 9px; position: absolute; top: 2px; left: 13px; border-radius: 50%; background: #b2677b; }
    .rabbit-mouth { width: 12px; height: 6px; position: absolute; top: 9px; left: 13px; border-bottom: 2px solid #675d68; border-radius: 50%; }
    .rabbit-teeth { display: flex; gap: 1.5px; position: absolute; bottom: -6px; left: 13px; }
    .rabbit-tooth { width: 5px; height: 6px; border: 1px solid #675d68; border-top: 0; border-radius: 0 0 2px 2px; background: #fff; }

    .monkey-ear {
      width: 38px;
      height: 38px;
      top: 26px;
      border: 5px solid #44322c;
      border-radius: 50%;
      background: #7a503d;
    }

    .monkey-ear.left { left: 0; }
    .monkey-ear.right { right: 0; }
    .monkey-head { border: 5px solid #44322c; border-radius: 50%; background: linear-gradient(145deg, #8b4a2f, #3f2926); }
    .monkey-face-mask { position: absolute; top: 8px; left: 14px; right: 14px; height: 40px; border-radius: 20px 20px 14px 14px; background: #edd2bd; clip-path: polygon(0 0, 50% 18%, 100% 0, 100% 100%, 0 100%); }
    .monkey-muzzle { width: 56px; height: 32px; position: absolute; left: 18px; bottom: 4px; z-index: 2; border: 3.5px solid #44322c; border-radius: 50%; background: #e6b290; }
    .monkey-nostril { width: 4px; height: 5px; position: absolute; top: 5px; border-radius: 50%; background: #44322c; }
    .monkey-nostril.left { left: 20px; }
    .monkey-nostril.right { right: 20px; }
    .monkey-mouth { width: 20px; height: 9px; position: absolute; top: 12px; left: 14px; border-bottom: 2.8px solid #44322c; border-radius: 50%; }

    @keyframes pet-float {
      0%, 100% { transform: translateY(0) scale(1.3) rotate(-2deg); }
      50% { transform: translateY(-6px) scale(1.3) rotate(2deg); }
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent);
    }

    .mode-switch {
      display: inline-flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.16);
    }

    .mode-button {
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 55%, var(--button-deep) 100%);
      font: 700 0.7rem 'Manrope', sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .mode-button:hover { color: var(--button-text); }
    .mode-button:active { transform: scale(0.95); }
    .mode-button.active {
      color: var(--button-text);
      background: linear-gradient(135deg, #fff1e5 0%, #f7c393 45%, #e98542 100%);
      box-shadow: 0 3px 12px rgba(234, 141, 84, 0.28);
    }

    .theme-toggle {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 55%, var(--button-deep) 100%);
      font-size: 1rem;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    [data-theme="light"] .theme-toggle { background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(248,208,168,0.9)); }
    .theme-toggle:hover { color: var(--button-text); }
    .theme-toggle:active { transform: scale(0.92); }

    .mode-button,
    .theme-toggle,
    .add-track,
    .player-button,
    .search-add,
    .track-remove {
      position: relative;
      overflow: hidden;
      border: 0;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 50%, var(--button-deep) 100%);
      box-shadow: 0 8px 15px var(--button-shadow), inset 0 -5px 10px rgba(0, 0, 0, 0.1), inset 0 5px 10px rgba(255, 255, 255, 0.52);
      transition: transform 300ms cubic-bezier(.175, .885, .32, 1.275), box-shadow 300ms ease, filter 300ms ease;
    }

    .mode-button::before,
    .theme-toggle::before,
    .add-track::before,
    .player-button::before,
    .search-add::before,
    .track-remove::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 15%;
      width: 70%;
      height: 25%;
      border-radius: 20px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .mode-button:hover,
    .theme-toggle:hover,
    .add-track:hover,
    .player-button:hover,
    .search-add:hover,
    .track-remove:hover {
      color: var(--button-text);
      filter: brightness(1.06);
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 15px 25px rgba(234, 141, 84, 0.4), inset 0 -5px 10px rgba(0, 0, 0, 0.1), inset 0 5px 10px rgba(255, 255, 255, 0.62);
    }

    .mode-button:active,
    .theme-toggle:active,
    .add-track:active,
    .player-button:active,
    .search-add:active,
    .track-remove:active {
      transform: scale(0.95) translateY(2px);
      box-shadow: 0 4px 8px rgba(234, 141, 84, 0.28), inset 0 -2px 5px rgba(0, 0, 0, 0.1), inset 0 2px 5px rgba(255, 255, 255, 0.4);
    }

    .mode-button:not(.active) {
      color: var(--button-text);
      background: linear-gradient(135deg, rgba(255,247,241,0.82), rgba(248,208,168,0.78), rgba(234,141,84,0.7));
      box-shadow: 0 5px 10px rgba(234, 141, 84, 0.18), inset 0 -3px 7px rgba(0, 0, 0, 0.08), inset 0 3px 7px rgba(255, 255, 255, 0.34);
    }

    .track-remove { width: 26px; height: 26px; padding: 0; border-radius: 50%; color: var(--button-text); }
    .search-add { border-radius: 50px; }

    .clock-area {
      margin: clamp(26px, 4vw, 54px) 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .animal {
      width: 126px;
      height: 88px;
      position: relative;
      margin: 0 auto clamp(22px, 3vw, 34px);
      transform-origin: center bottom;
      animation: animal-float 3.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.2));
    }

    .animal-ear {
      width: 42px;
      height: 42px;
      position: absolute;
      top: 0;
      border: 5px solid #51372f;
      border-radius: 50%;
      background: #8c614a;
    }

    .animal-ear::after {
      content: '';
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #d69a7c;
    }

    .animal-ear.left { left: 12px; }
    .animal-ear.right { right: 12px; }

    .animal-head {
      width: 102px;
      height: 74px;
      position: absolute;
      left: 12px;
      top: 14px;
      z-index: 1;
      border: 5px solid #51372f;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(145deg, #b47b5c, #76503e);
    }

    .animal-eye {
      width: 22px;
      height: 19px;
      position: absolute;
      top: 22px;
      border-radius: 50%;
      background: #fffaf0;
      box-shadow: inset 0 -2px 3px rgba(81, 55, 47, 0.22);
    }

    .animal-eye.left { left: 19px; }
    .animal-eye.right { right: 19px; }

    .animal-pupil {
      width: 9px;
      height: 11px;
      position: absolute;
      top: 4px;
      left: 7px;
      border-radius: 50%;
      background: #182125;
      will-change: transform;
    }

    .animal-pupil::after {
      content: '';
      width: 3px;
      height: 3px;
      position: absolute;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .animal-muzzle {
      width: 42px;
      height: 27px;
      position: absolute;
      left: 25px;
      bottom: 6px;
      border-radius: 50%;
      background: #dca784;
    }

    .animal-nose {
      width: 14px;
      height: 10px;
      position: absolute;
      top: 4px;
      left: 14px;
      border-radius: 50%;
      background: #392622;
    }

    .animal-mouth {
      width: 14px;
      height: 8px;
      position: absolute;
      top: 11px;
      left: 14px;
      border-bottom: 2px solid #392622;
      border-radius: 50%;
    }

    .animal-cat .animal-ear {
      width: 42px;
      height: 46px;
      top: -2px;
      border: 0;
      border-radius: 0;
      background: #e9e7e9;
      clip-path: polygon(0 100%, 24% 0, 100% 100%);
    }

    .animal-cat .animal-ear::after {
      inset: 8px 10px 8px 11px;
      background: #eca4b5;
      clip-path: polygon(0 100%, 28% 0, 100% 100%);
    }

    .animal-cat .animal-head { border-color: #554b52; background: linear-gradient(145deg, #f1f1f2, #d7d6db); }
    .animal-cat .animal-muzzle { background: #f4cbd3; }
    .animal-cat .animal-nose { width: 11px; height: 8px; left: 15px; background: #b7657d; }
    .animal-cat .animal-eye { width: 25px; height: 25px; top: 20px; border: 4px solid #675b65; border-radius: 50%; background: #fffdf4; }
    .animal-cat .animal-pupil { width: 11px; height: 14px; left: 3px; top: 1px; }
    .animal-cat .animal-muzzle::before,
    .animal-cat .animal-muzzle::after {
      content: '';
      width: 25px;
      height: 8px;
      position: absolute;
      top: 9px;
      border-top: 1px solid rgba(76, 48, 40, 0.65);
      border-bottom: 1px solid rgba(76, 48, 40, 0.45);
    }

    .animal-cat .animal-muzzle::before { left: -22px; transform: rotate(8deg); }
    .animal-cat .animal-muzzle::after { right: -22px; transform: rotate(-8deg); }

    .animal-monkey .animal-ear {
      width: 35px;
      height: 35px;
      top: 20px;
      border-color: #51372f;
      background: #a86f4f;
    }

    .animal-monkey .animal-ear::after { background: #d69a7c; }
    .animal-monkey .animal-head { border-radius: 45% 45% 42% 42%; background: linear-gradient(145deg, #8b4a2f, #3f2926); }
    .animal-monkey .animal-muzzle { width: 47px; height: 31px; left: 22px; bottom: 3px; background: #e1aa79; }
    .animal-monkey .animal-nose { border-radius: 45%; }

    .animal-mouse .animal-ear {
      width: 46px;
      height: 46px;
      border-color: #5b4b50;
      background: #a99ba0;
    }

    .animal-mouse .animal-ear::after { background: #e6b5bd; }
    .animal-mouse .animal-head { border-color: #4c4249; border-radius: 46% 46% 42% 42%; background: linear-gradient(145deg, #c9c5cb, #69616b); }
    .animal-mouse .animal-muzzle { background: #e0c5c5; }
    .animal-mouse .animal-nose { width: 10px; height: 8px; left: 16px; background: #9b5361; }
    .animal-mouse .animal-muzzle::before,
    .animal-mouse .animal-muzzle::after {
      content: '';
      width: 28px;
      height: 12px;
      position: absolute;
      top: 8px;
      border-top: 1px solid rgba(91, 75, 80, 0.6);
      border-bottom: 1px solid rgba(91, 75, 80, 0.42);
    }

    .animal-mouse .animal-muzzle::before { left: -25px; transform: rotate(7deg); }
    .animal-mouse .animal-muzzle::after { right: -25px; transform: rotate(-7deg); }

    .animal-rabbit .animal-ear {
      width: 25px;
      height: 53px;
      top: -15px;
      border-color: #63505b;
      border-radius: 50% 50% 42% 42%;
      background: #f0e4e8;
    }

    .animal-rabbit .animal-ear.left { left: 31px; transform: rotate(-10deg); }
    .animal-rabbit .animal-ear.right { right: 31px; transform: rotate(10deg); }
    .animal-rabbit .animal-ear::after { inset: 6px; background: #e8a9b8; }
    .animal-rabbit .animal-head { border-color: #675d68; background: linear-gradient(145deg, #e4dce8, #c6b7cc); }
    .animal-rabbit .animal-eye { width: 24px; height: 24px; top: 21px; border: 4px solid #6c606b; border-radius: 50%; background: #fffdfd; }
    .animal-rabbit .animal-pupil { width: 10px; height: 12px; left: 3px; top: 2px; }
    .animal-rabbit .animal-muzzle { background: #f1c9d2; }
    .animal-rabbit .animal-nose { width: 11px; height: 8px; left: 15px; background: #b2677b; }
    .animal-rabbit .animal-muzzle::after {
      content: '';
      width: 14px;
      height: 8px;
      position: absolute;
      left: 14px;
      bottom: -4px;
      border-radius: 0 0 5px 5px;
      background: #fffafc;
      box-shadow: 15px 0 #fffafc;
    }

    .animal-bear .animal-ear { border-color: #57372d; background: #a96542; }
    .animal-bear .animal-ear::after { background: #efa28d; }
    .animal-bear .animal-head { border-color: #57372d; background: linear-gradient(145deg, #b36d43, #8f5035); }
    .animal-bear .animal-eye { width: 24px; height: 24px; top: 20px; }
    .animal-bear .animal-pupil { width: 11px; height: 13px; left: 6px; top: 3px; }
    .animal-bear .animal-muzzle { background: #e4a85c; }
    .animal-bear .animal-nose { background: #593128; }

    @keyframes animal-float {
      0%, 100% { transform: translateY(0) scale(1.35) rotate(-2deg); }
      50% { transform: translateY(-6px) scale(1.35) rotate(2deg); }
    }

    .time {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1vw, 14px);
      color: var(--text);
      font-family: 'Space Grotesk', 'DM Mono', sans-serif;
      font-size: clamp(3.7rem, 13.5vw, 9.6rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px rgba(157, 226, 208, 0.16), 0 8px 40px rgba(0, 0, 0, 0.28);
    }

    [data-theme="light"] .time {
      text-shadow: 0 0 18px rgba(33, 140, 120, 0.18), 0 8px 30px rgba(48, 77, 73, 0.16);
    }

    .digit {
      display: inline-grid;
      min-width: 0.58em;
      overflow: hidden;
      border-radius: 10px;
    }

    .digit span { display: block; }
    [data-theme="light"] .digit,
    [data-theme="light"] .digit span {
      background: transparent;
    }
    [data-theme="light"] .digit {
      overflow: visible;
      border-radius: 0;
    }
    .digit span.changing { animation: digit-flip 360ms cubic-bezier(.2,.8,.2,1); }

    .separator {
      color: var(--accent);
      font-size: 0.7em;
      transform: translateY(-0.04em);
      animation: pulse 2s ease-in-out infinite;
    }

    .period {
      align-self: flex-end;
      margin: 0 0 0.12em 10px;
      color: var(--warm);
      font-family: 'Manrope', sans-serif;
      font-size: clamp(0.75rem, 2vw, 1rem);
      font-weight: 800;
      letter-spacing: 0.13em;
    }

    .date-row {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .date {
      color: var(--text);
      font-size: clamp(0.9rem, 2vw, 1.08rem);
      font-weight: 600;
    }

    .date strong { color: var(--accent); font-weight: 700; }

    .timezone {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .music-panel {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .music-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .music-title {
      margin: 0;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .music-hint {
      color: var(--muted);
      font-size: 0.68rem;
    }

    .track-form {
      display: flex;
      gap: 8px;
    }

    .search-form { margin-bottom: 10px; }

    .soundcloud-player {
      width: 100%;
      height: 126px;
      display: none;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #f2f2f2;
    }

    .search-results {
      display: grid;
      gap: 6px;
      max-height: 112px;
      margin-bottom: 12px;
      overflow: auto;
    }

    .search-results:empty { display: none; }

    .search-result {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
    }

    [data-theme="light"] .search-result { background: rgba(255, 255, 255, 0.42); }
    .search-art { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; }
    .search-copy { min-width: 0; }
    .search-song, .search-artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-song { color: var(--text); font-size: 0.72rem; font-weight: 800; }
    .search-artist { margin-top: 2px; color: var(--muted); font-size: 0.65rem; }
    .search-add { min-width: 34px; height: 30px; padding: 0 9px; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; color: var(--button-text); background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 50%, var(--button-deep) 100%); cursor: pointer; font-weight: 800; }
    .search-empty { padding: 8px 2px; color: var(--muted); font-size: 0.68rem; }

    .track-input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
      color: var(--text);
      background: rgba(0, 0, 0, 0.14);
      font: 0.78rem 'DM Mono', monospace;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    [data-theme="light"] .track-input { background: rgba(255, 255, 255, 0.52); }
    .track-input::placeholder { color: var(--muted); }
    .track-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234, 141, 84, 0.12); }

    .add-track,
    .player-button {
      border: 0;
      border-radius: 10px;
      color: var(--button-text);
      background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 50%, var(--button-deep) 100%);
      box-shadow: 0 8px 15px var(--button-shadow), inset 0 -5px 10px rgba(0, 0, 0, 0.1), inset 0 5px 10px rgba(255, 255, 255, 0.42);
      font: 700 0.72rem 'Manrope', sans-serif;
      cursor: pointer;
      transition: transform 300ms cubic-bezier(.175, .885, .32, 1.275), box-shadow 300ms ease, filter 300ms ease;
    }

    .add-track { padding: 0 16px; white-space: nowrap; }
    .add-track:hover, .player-button:hover { filter: brightness(1.08); }
    .add-track:active, .player-button:active { filter: brightness(0.98); }

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .current-track {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-status {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .player-actions { display: flex; gap: 6px; }
    .player-button { width: 34px; height: 34px; padding: 0; font-size: 0.85rem; }
    .player-button.active { color: var(--button-text); background: linear-gradient(135deg, #fff1e5 0%, #f7c393 45%, #e98542 100%); }
    .player-button:disabled { cursor: not-allowed; opacity: 0.4; }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 112px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .volume-slider {
      width: 82px;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .playlist {
      display: grid;
      gap: 6px;
      max-height: 92px;
      margin-top: 10px;
      overflow: auto;
    }

    .playlist:empty::before {
      content: 'Playlist đang trống · thêm link audio để bắt đầu';
      padding: 8px 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.08);
      cursor: pointer;
      font-size: 0.7rem;
      text-align: left;
    }

    [data-theme="light"] .track-item { background: rgba(255, 255, 255, 0.42); }
    .track-item:hover, .track-item.active { border-color: var(--accent); color: var(--text); }
    .track-number { flex: 0 0 20px; color: var(--accent); font-family: 'DM Mono', monospace; }
    .track-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-remove { margin-left: auto; border: 0; color: var(--button-text); background: linear-gradient(135deg, var(--button-light) 0%, var(--button-mid) 50%, var(--button-deep) 100%); cursor: pointer; }
    .track-remove:hover { color: var(--button-text); filter: brightness(1.05); }

    audio { display: none; }

    @keyframes digit-flip {
      0% { opacity: 0.3; transform: translateY(-18%); filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (max-width: 560px) {
      body { overflow: auto; padding: 16px 0; }
      .clock-shell { border-radius: 22px; padding: 26px 20px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; flex-wrap: wrap; justify-content: center; gap: 6px; }
      .pet-switch { width: 100%; justify-content: center; }
      .clock-area { margin-top: 58px; }
      .date-row { align-items: flex-start; flex-direction: column; gap: 9px; }
      .timezone { font-size: 0.66rem; }
      .music-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .track-form { flex-direction: column; }
      .add-track { min-height: 40px; }
      .player-bar { grid-template-columns: 1fr; }
      .player-actions { justify-content: flex-end; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="clock-shell" aria-label="Đồng hồ hiện tại">
    <div class="topbar">
      <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Thời gian hiện tại</div>
      <div class="controls">
        <div class="pet-switch" role="group" aria-label="Chọn con vật">
          <button class="pet-button active" type="button" data-pet="bear">🐻 Gấu</button>
          <button class="pet-button" type="button" data-pet="cat">🐱 Mèo</button>
          <button class="pet-button" type="button" data-pet="rabbit">🐰 Thỏ</button>
          <button class="pet-button" type="button" data-pet="monkey">🐵 Khỉ</button>
        </div>
        <div class="mode-switch" role="group" aria-label="Chọn định dạng giờ">
          <button class="mode-button active" data-mode="24" type="button">24 GIỜ</button>
          <button class="mode-button" data-mode="12" type="button">12 GIỜ</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Chuyển sang chế độ sáng" title="Chuyển chế độ sáng/tối">☼</button>
      </div>
    </div>

    <section class="clock-area">
      <div class="pet-stage" aria-label="Con vật đang nhìn theo con trỏ chuột">
        <div class="pet-entity active" id="pet-bear" aria-label="Chú gấu đang nhìn theo con trỏ chuột">
          <span class="bear-ear left"></span>
          <span class="bear-ear right"></span>
          <div class="bear-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="bear-muzzle"><span class="bear-nose"></span><span class="bear-mouth"></span></div>
          </div>
        </div>

        <div class="pet-entity" id="pet-cat" aria-label="Chú mèo đang nhìn theo con trỏ chuột">
          <span class="cat-ear left"></span>
          <span class="cat-ear right"></span>
          <div class="cat-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <span class="cat-nose"></span>
            <span class="cat-mouth"></span>
            <span class="cat-whiskers left"></span>
            <span class="cat-whiskers right"></span>
          </div>
        </div>

        <div class="pet-entity" id="pet-rabbit" aria-label="Chú thỏ đang nhìn theo con trỏ chuột">
          <span class="rabbit-ear left"></span>
          <span class="rabbit-ear right"></span>
          <div class="rabbit-head">
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="rabbit-muzzle">
              <span class="rabbit-nose"></span>
              <span class="rabbit-mouth"></span>
              <div class="rabbit-teeth"><span class="rabbit-tooth"></span><span class="rabbit-tooth"></span></div>
            </div>
          </div>
        </div>

        <div class="pet-entity" id="pet-monkey" aria-label="Chú khỉ đang nhìn theo con trỏ chuột">
          <span class="monkey-ear left"></span>
          <span class="monkey-ear right"></span>
          <div class="monkey-head">
            <div class="monkey-face-mask"></div>
            <span class="pet-eye left"><span class="pet-pupil"></span></span>
            <span class="pet-eye right"><span class="pet-pupil"></span></span>
            <div class="monkey-muzzle">
              <span class="monkey-nostril left"></span>
              <span class="monkey-nostril right"></span>
              <span class="monkey-mouth"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="time" aria-live="polite" aria-label="Giờ hiện tại">
        <div class="digit"><span id="hour-tens">0</span></div>
        <div class="digit"><span id="hour-ones">0</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="digit"><span id="minute-tens">0</span></div>
        <div class="digit"><span id="minute-ones">0</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="digit"><span id="second-tens">0</span></div>
        <div class="digit"><span id="second-ones">0</span></div>
        <span class="period" id="period" aria-hidden="true"></span>
      </div>
    </section>

    <div class="date-row">
      <div class="date"><strong id="weekday">Thứ Hai</strong><span id="calendar-date">, 01 tháng 01 năm 2026</span></div>
      <div class="timezone" id="timezone">LOCAL TIME</div>
    </div>

    <section class="music-panel" aria-label="Trình phát nhạc">
      <div class="music-heading">
        <h2 class="music-title">Music console</h2>
        <span class="music-hint">SoundCloud Embed · phát trực tiếp trong trang</span>
      </div>
      <form class="track-form search-form" id="search-form">
        <input class="track-input" id="search-input" type="url" placeholder="Dán link bài hát hoặc playlist SoundCloud..." autocomplete="off" required>
        <button class="add-track" type="submit">+ Thêm SoundCloud</button>
      </form>
      <div class="search-results" id="search-results" aria-live="polite"></div>
      <div class="player-bar">
        <div>
          <div class="current-track" id="current-track">Chưa có bài hát</div>
          <div class="player-status" id="player-status">Thêm link audio để phát playlist tự động</div>
        </div>
        <div class="player-actions">
          <button class="player-button" id="repeat-track" type="button" aria-label="Lặp bài đang chọn" title="Lặp bài đang chọn">↻</button>
          <button class="player-button" id="previous-track" type="button" aria-label="Bài trước" title="Bài trước">‹</button>
          <button class="player-button" id="toggle-play" type="button" aria-label="Phát nhạc" title="Phát nhạc">▶</button>
          <button class="player-button" id="next-track" type="button" aria-label="Bài tiếp theo" title="Bài tiếp theo">›</button>
          <label class="volume-control" for="volume-slider" title="Âm lượng">🔊<input class="volume-slider" id="volume-slider" type="range" min="0" max="100" value="80" aria-label="Âm lượng"></label>
        </div>
      </div>
      <div class="playlist" id="playlist" aria-live="polite"></div>
      <audio id="audio-player" preload="metadata"></audio>
      <iframe class="soundcloud-player" id="soundcloud-player" title="SoundCloud player" allow="autoplay" scrolling="no"></iframe>
    </section>
  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    const weekdays = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    let mode = 24;
    const savedTheme = localStorage.getItem('clock-theme');
    const savedAnimal = localStorage.getItem('clock-animal') || 'bear';

    const elements = {
      hourTens: document.getElementById('hour-tens'),
      hourOnes: document.getElementById('hour-ones'),
      minuteTens: document.getElementById('minute-tens'),
      minuteOnes: document.getElementById('minute-ones'),
      secondTens: document.getElementById('second-tens'),
      secondOnes: document.getElementById('second-ones'),
      period: document.getElementById('period'),
      weekday: document.getElementById('weekday'),
      calendarDate: document.getElementById('calendar-date'),
      timezone: document.getElementById('timezone'),
      themeToggle: document.getElementById('theme-toggle'),
      searchForm: document.getElementById('search-form'),
      searchInput: document.getElementById('search-input'),
      searchResults: document.getElementById('search-results'),
      playlist: document.getElementById('playlist'),
      audioPlayer: document.getElementById('audio-player'),
      currentTrack: document.getElementById('current-track'),
      playerStatus: document.getElementById('player-status'),
      togglePlay: document.getElementById('toggle-play'),
      previousTrack: document.getElementById('previous-track'),
      nextTrack: document.getElementById('next-track'),
      repeatTrack: document.getElementById('repeat-track'),
      volumeSlider: document.getElementById('volume-slider')
      ,soundcloudPlayer: document.getElementById('soundcloud-player')
    };

    let playlist = JSON.parse(localStorage.getItem('clock-playlist') || '[]').filter(track => !track.isNct);
    let currentTrackIndex = -1;
    let soundcloudWidget = null;
    let repeatTrack = localStorage.getItem('clock-repeat-track') === 'true';

    const petButtons = document.querySelectorAll('.pet-button');
    const petEntities = document.querySelectorAll('.pet-entity');
    const allPupils = document.querySelectorAll('.pet-pupil');
    const pupilPositions = new WeakMap([...allPupils].map(pupil => [pupil, { x: 0, y: 0 }]));
    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 2;

    document.addEventListener('pointermove', event => {
      pointerX = event.clientX;
      pointerY = event.clientY;
    });

    function animatePupils() {
      const activePet = document.querySelector('.pet-entity.active');
      activePet?.querySelectorAll('.pet-pupil').forEach(pupil => {
        const eye = pupil.parentElement.getBoundingClientRect();
        const targetX = Math.max(-1, Math.min(1, (pointerX - (eye.left + eye.width / 2)) / 75)) * 5;
        const targetY = Math.max(-1, Math.min(1, (pointerY - (eye.top + eye.height / 2)) / 75)) * 4;
        const position = pupilPositions.get(pupil);
        position.x += (targetX - position.x) * 0.24;
        position.y += (targetY - position.y) * 0.24;
        pupil.style.transform = `translate3d(${position.x.toFixed(2)}px, ${position.y.toFixed(2)}px, 0)`;
      });
      requestAnimationFrame(animatePupils);
    }

    requestAnimationFrame(animatePupils);

    function setTheme(theme) {
      const isLight = theme === 'light';
      document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
      elements.themeToggle.textContent = isLight ? '☾' : '☼';
      elements.themeToggle.setAttribute('aria-label', isLight ? 'Chuyển sang chế độ tối' : 'Chuyển sang chế độ sáng');
      localStorage.setItem('clock-theme', isLight ? 'light' : 'dark');
    }

    function setActivePet(name) {
      const validPet = ['bear', 'cat', 'rabbit', 'monkey'].includes(name) ? name : 'bear';
      petButtons.forEach(button => button.classList.toggle('active', button.dataset.pet === validPet));
      petEntities.forEach(entity => entity.classList.toggle('active', entity.id === `pet-${validPet}`));
      localStorage.setItem('clock-animal', validPet);
    }

    function updateDigit(element, value) {
      if (element.textContent === value) return;
      element.textContent = value;
      element.classList.remove('changing');
      void element.offsetWidth;
      element.classList.add('changing');
    }

    function savePlaylist() {
      localStorage.setItem('clock-playlist', JSON.stringify(playlist));
    }

    function renderPlaylist() {
      elements.playlist.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `track-item${index === currentTrackIndex ? ' active' : ''}`;
        item.innerHTML = `<span class="track-number">${String(index + 1).padStart(2, '0')}</span><span class="track-name">${track.name}</span><button class="track-remove" type="button" aria-label="Xóa bài">×</button>`;
        item.addEventListener('click', event => {
          if (event.target.closest('.track-remove')) {
            playlist.splice(index, 1);
            if (currentTrackIndex >= playlist.length) currentTrackIndex = playlist.length - 1;
            savePlaylist();
            renderPlaylist();
            return;
          }
          playTrack(index);
        });
        elements.playlist.appendChild(item);
      });
    }

    function playTrack(index) {
      const track = playlist[index];
      if (!track) return;
      currentTrackIndex = index;
      renderPlaylist();
      elements.currentTrack.textContent = track.name;

      if (track.source === 'soundcloud') {
        elements.audioPlayer.pause();
        elements.audioPlayer.removeAttribute('src');
        elements.soundcloudPlayer.style.display = 'block';
        elements.playerStatus.textContent = 'Đang tải SoundCloud...';
        elements.togglePlay.textContent = 'Ⅱ';
        elements.soundcloudPlayer.onload = () => {
          soundcloudWidget = SC.Widget(elements.soundcloudPlayer);
          soundcloudWidget.setVolume(Number(elements.volumeSlider.value));
          soundcloudWidget.bind(SC.Widget.Events.PLAY, () => {
            elements.playerStatus.textContent = 'Đang phát SoundCloud';
            elements.togglePlay.textContent = 'Ⅱ';
          });
          soundcloudWidget.bind(SC.Widget.Events.PAUSE, () => {
            elements.playerStatus.textContent = 'Đã tạm dừng SoundCloud';
            elements.togglePlay.textContent = '▶';
          });
          soundcloudWidget.bind(SC.Widget.Events.FINISH, () => {
            if (repeatTrack) {
              soundcloudWidget.seekTo(0);
              soundcloudWidget.play();
            } else {
              moveTrack(1);
            }
          });
          soundcloudWidget.bind(SC.Widget.Events.ERROR, () => {
            elements.playerStatus.textContent = 'SoundCloud không thể phát link này';
            elements.togglePlay.textContent = '▶';
          });
        };
        elements.soundcloudPlayer.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(track.url)}&color=%239de2d0&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false`;
        return;
      }

      elements.soundcloudPlayer.style.display = 'none';

      elements.audioPlayer.src = track.url;
      elements.audioPlayer.loop = repeatTrack;
      elements.playerStatus.textContent = 'Đang tải audio...';
      elements.audioPlayer.play().then(() => {
      }).catch(() => {
        elements.playerStatus.textContent = 'Nguồn audio này không phát được · hãy chọn bài khác';
        elements.togglePlay.textContent = '▶';
      });
    }

    function moveTrack(step) {
      if (!playlist.length) return;
      const nextIndex = currentTrackIndex < 0 ? 0 : (currentTrackIndex + step + playlist.length) % playlist.length;
      playTrack(nextIndex);
    }

    function normalizeTrackUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.hostname.includes('soundcloud.com')) {
          return `${parsed.origin}${parsed.pathname}`.replace(/\/$/, '').toLowerCase();
        }
        return parsed.href.replace(/\/$/, '').toLowerCase();
      } catch {
        return url.trim().toLowerCase();
      }
    }

    function addTrack(track) {
      const normalizedUrl = normalizeTrackUrl(track.url);
      const alreadyAdded = playlist.some(item => normalizeTrackUrl(item.url) === normalizedUrl);
      if (alreadyAdded) {
        elements.playerStatus.textContent = 'Bài hát này đã được thêm vào playlist';
        return false;
      }
      playlist.push(track);
      savePlaylist();
      renderPlaylist();
      if (currentTrackIndex < 0) playTrack(0);
      return true;
    }

    function renderSearchResults(results) {
      elements.searchResults.innerHTML = '';
      if (!results.length) {
        elements.searchResults.innerHTML = '<div class="search-empty">Không tìm thấy bản preview có thể phát.</div>';
        return;
      }
      results.forEach(result => {
        const item = document.createElement('div');
        item.className = 'search-result';
        item.innerHTML = `<img class="search-art" src="${result.thumbnail || ''}" alt=""><div class="search-copy"><div class="search-song">${result.title}</div><div class="search-artist">${result.creator || 'Openverse'} · ${result.license || 'CC'}</div></div><button class="search-add" type="button">+</button>`;
        item.querySelector('.search-add').addEventListener('click', () => {
          addTrack({ url: result.url, name: `${result.title} · ${result.creator || 'Openverse'}` });
          item.remove();
        });
        elements.searchResults.appendChild(item);
      });
    }

    elements.searchForm.addEventListener('submit', async event => {
      event.preventDefault();
      const url = elements.searchInput.value.trim();
      if (!url) return;
      if (!/^(https?:\/\/)(www\.|on\.)?soundcloud\.com\//i.test(url)) {
        elements.playerStatus.textContent = 'Vui lòng nhập link SoundCloud hợp lệ';
        return;
      }
      elements.playerStatus.textContent = 'Đang lấy thông tin SoundCloud...';
      let resolvedUrl = url;
      try {
        if (/^https?:\/\/on\.soundcloud\.com\//i.test(url)) {
          const redirectResponse = await fetch(url, { redirect: 'follow' });
          resolvedUrl = redirectResponse.url;
        }
        const cleanUrl = resolvedUrl.split('?')[0];
        const response = await fetch(`https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(cleanUrl)}`);
        const data = response.ok ? await response.json() : null;
        const fallbackName = cleanUrl.split('/').filter(Boolean).pop()?.replace(/[-_]+/g, ' ') || 'SoundCloud track';
        const added = addTrack({ source: 'soundcloud', url: cleanUrl, name: data?.title || fallbackName });
        elements.searchInput.value = '';
        if (added) elements.playerStatus.textContent = data ? 'Đã thêm vào playlist SoundCloud' : 'Đã thêm link · SoundCloud đang tải player';
      } catch {
        if (resolvedUrl !== url) {
          const fallbackName = resolvedUrl.split('/').filter(Boolean).pop()?.replace(/[-_]+/g, ' ') || 'SoundCloud track';
          const added = addTrack({ source: 'soundcloud', url: resolvedUrl.split('?')[0], name: fallbackName });
          elements.searchInput.value = '';
          if (added) elements.playerStatus.textContent = 'Đã thêm link · SoundCloud đang tải player';
        } else {
          elements.playerStatus.textContent = 'Không nhận diện được link SoundCloud';
        }
      }
    });

    elements.togglePlay.addEventListener('click', () => {
      if (currentTrackIndex < 0) return moveTrack(1);
      if (playlist[currentTrackIndex].source === 'soundcloud') {
        if (soundcloudWidget) {
          soundcloudWidget.toggle();
        } else {
          elements.playerStatus.textContent = 'SoundCloud đang tải player...';
        }
        return;
      }
      if (elements.audioPlayer.paused) {
        elements.audioPlayer.play();
        elements.playerStatus.textContent = 'Đang tải audio...';
      } else {
        elements.audioPlayer.pause();
        elements.playerStatus.textContent = 'Đã tạm dừng';
        elements.togglePlay.textContent = '▶';
      }
    });

    elements.previousTrack.addEventListener('click', () => moveTrack(-1));
    elements.nextTrack.addEventListener('click', () => moveTrack(1));
    elements.repeatTrack.classList.toggle('active', repeatTrack);
    elements.repeatTrack.addEventListener('click', () => {
      repeatTrack = !repeatTrack;
      elements.repeatTrack.classList.toggle('active', repeatTrack);
      elements.repeatTrack.setAttribute('aria-label', repeatTrack ? 'Tắt lặp bài' : 'Lặp bài đang chọn');
      elements.repeatTrack.title = repeatTrack ? 'Tắt lặp bài' : 'Lặp bài đang chọn';
      localStorage.setItem('clock-repeat-track', String(repeatTrack));
      elements.audioPlayer.loop = repeatTrack;
      elements.playerStatus.textContent = repeatTrack ? 'Đã bật lặp bài' : 'Đã tắt lặp bài';
    });
    elements.volumeSlider.addEventListener('input', () => {
      const volume = Number(elements.volumeSlider.value);
      elements.audioPlayer.volume = volume / 100;
      if (soundcloudWidget) soundcloudWidget.setVolume(volume);
    });
    elements.audioPlayer.addEventListener('ended', () => {
      if (!repeatTrack) moveTrack(1);
    });
    elements.audioPlayer.addEventListener('playing', () => {
      elements.playerStatus.textContent = 'Đang phát · tự chuyển bài khi kết thúc';
      elements.togglePlay.textContent = 'Ⅱ';
    });
    elements.audioPlayer.addEventListener('error', () => {
      elements.playerStatus.textContent = 'Nguồn audio này không phát được · hãy chọn bài khác';
      elements.togglePlay.textContent = '▶';
    });
    elements.audioPlayer.addEventListener('pause', () => {
      if (!elements.audioPlayer.ended && currentTrackIndex >= 0) elements.togglePlay.textContent = '▶';
    });

    function updateClock() {
      const now = new Date();
      const hour24 = now.getHours();
      const isAfternoon = hour24 >= 12;
      const displayedHour = mode === 12 ? (hour24 % 12 || 12) : hour24;
      const time = [displayedHour, now.getMinutes(), now.getSeconds()]
        .map(value => String(value).padStart(2, '0')).join('');

      const digits = [time[0], time[1], time[2], time[3], time[4], time[5]];
      [elements.hourTens, elements.hourOnes, elements.minuteTens, elements.minuteOnes, elements.secondTens, elements.secondOnes]
        .forEach((element, index) => updateDigit(element, digits[index]));

      elements.period.textContent = mode === 12 ? (isAfternoon ? 'PM' : 'AM') : '';
      elements.weekday.textContent = weekdays[now.getDay()];
      const month = String(now.getMonth() + 1).padStart(2, '0');
      elements.calendarDate.textContent = `, ${now.getDate()} tháng ${month} năm ${now.getFullYear()}`;
      elements.timezone.textContent = `LOCAL TIME · UTC${formatOffset(now.getTimezoneOffset())}`;
    }

    function formatOffset(offset) {
      const sign = offset <= 0 ? '+' : '-';
      const absolute = Math.abs(offset);
      return `${sign}${String(Math.floor(absolute / 60)).padStart(2, '0')}:${String(absolute % 60).padStart(2, '0')}`;
    }

    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', () => {
        mode = Number(button.dataset.mode);
        document.querySelectorAll('.mode-button').forEach(item => item.classList.toggle('active', item === button));
        updateClock();
      });
    });

    elements.themeToggle.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    });

    petButtons.forEach(button => {
      button.addEventListener('click', () => setActivePet(button.dataset.pet));
    });

    setTheme(savedTheme === 'light' ? 'light' : 'dark');
    setActivePet(savedAnimal);
    renderPlaylist();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
